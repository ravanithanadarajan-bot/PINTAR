<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PINTAR - Edit Quiz</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #1e293b;
            padding-bottom: 80px;
        }

        /* --- NAVIGATION BAR --- */
        .navbar {
            background-color: #273894;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            height: 70px;
            color: white;
            border-radius: 50px;
            margin: 20px auto 0 auto;
            width: 95%;
        }

        .navbar .logo {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: white;
        }

        .navbar nav {
            display: flex;
            gap: 40px;
            height: 100%;
            align-items: center;
        }

        .navbar nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            display: inline-block;
            position: relative;
            padding: 6px 0;
        }

        .navbar nav a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
        }

        .navbar .right-menu {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .navbar .logout {
            background: none;
            border: none;
            color: white;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
        }

        .navbar .profile {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #3b4ca6;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
        }

        .container {
            width: 95%;
            margin: 0 auto;
            padding: 20px 0;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #2563eb;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* --- MAIN WHITE PANEL CONTAINER --- */
        .edit-panel {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.01);
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 35px;
        }

        .form-control-input {
            width: 100%;
            max-width: 600px;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            outline: none;
        }

        /* --- QUESTION ACCORDION SYSTEM --- */
        .question-accordion {
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            background: white;
        }

        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 25px;
            background-color: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            color: #273894;
            user-select: none;
        }

        .accordion-content {
            padding: 0 25px 25px 25px;
            display: none;
            /* Controlled via active class toggle */
            border-top: 1px solid #f1f5f9;
            background-color: white;
        }

        .question-accordion.open .accordion-content {
            display: block;
        }

        .question-accordion.open .accordion-header i {
            transform: rotate(180deg);
        }

        .accordion-header i {
            transition: transform 0.2s ease;
            color: #64748b;
            font-size: 14px;
        }

        /* Inside Block Fields styling */
        .field-label {
            font-size: 14px;
            font-weight: 700;
            color: #273894;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        .select-input {
            width: 100%;
            max-width: 600px;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            background-color: white;
            color: #1e293b;
            outline: none;
            cursor: pointer;
        }

        .option-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
            max-width: 600px;
        }

        .option-radio-mock {
            width: 20px;
            height: 20px;
            border: 2px solid #273894;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .btn-add-option {
            background: transparent;
            color: #273894;
            border: 1px solid #273894;
            padding: 5px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            outline: none;
        }

        /* --- ACTION SUBMIT BUTTON --- */
        .action-container {
            display: flex;
            justify-content: center;
            margin-top: 35px;
        }

        .btn-submit-save {
            background-color: #273894;
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(39, 56, 148, 0.2);
        }

        .btn-submit-save:hover {
            background-color: #1e2c73;
        }

        /* Updated for Logo Image Support */
        .navbar .logo {
            display: flex;
            align-items: center;
        }

        .navbar .logo img {
            height: 38px;
            /* Perfectly bounds and scales your logo image inside the header */
            width: auto;
            display: block;
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <header class="navbar">
        <div class="logo">
            <!-- Added ../ to step out of the authority folder -->
            <img src="../images/logo.png" alt="PINTAR Logo">
        </div>
        <nav>
            <a href="dashboard.html">Home</a>
            <a href="schools.html">Schools</a>
            <a href="quizzes.html" class="active">Quizzes</a>
            <a href="reports.html">Reports & Analytics</a>
        </nav>
        <div class="right-menu">
            <button class="icon-btn"><i class="fa-regular fa-bell"></i></button>
            <button class="logout" id="logoutBtn" onclick="window.location.href='../index.html'">LOG OUT</button>
            <div class="profile">
                <i class="fa-solid fa-circle-user"></i>
                <span>PINTAR</span>
            </div>
        </div>
    </header>

    <!-- ================= MAIN EDIT LAYOUT ================= -->
    <main class="container">
        <a href="quizzes.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back</a>

        <div class="edit-panel">
            <!-- Title Entry Section -->
            <h2 class="section-title" style="color:#273894;">Title</h2>
            <div class="form-group">
                <input type="text" class="form-control-input" value="Student's Digital Skills">
            </div>

            <h2 class="section-title" style="color:#273894; margin-bottom: 20px;">Questions</h2>

            <!-- QUESTION 1 (OPEN BY DEFAULT) -->
            <div class="question-accordion open">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <span>Question 1</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="accordion-content">
                    <div class="field-label">Question Type</div>
                    <select class="select-input">
                        <option>Multiple Choice (Single Answer)</option>
                    </select>

                    <div class="field-label">Question</div>
                    <input type="text" class="form-control-input"
                        value="1. Should you tell your password to your friends?">

                    <div class="field-label">Options</div>
                    <div class="option-row">
                        <div class="option-radio-mock"></div>
                        <input type="text" class="form-control-input" value="Yes">
                    </div>
                    <div class="option-row">
                        <div class="option-radio-mock"></div>
                        <input type="text" class="form-control-input" value="No">
                    </div>
                    <button type="button" class="btn-add-option">Add</button>
                </div>
            </div>

            <!-- QUESTION 2 -->
            <div class="question-accordion">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <span>Question 2</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="accordion-content">
                    <div class="field-label">Question Type</div>
                    <select class="select-input">
                        <option>Multiple Choice (Single Answer)</option>
                    </select>
                    <div class="field-label">Question</div>
                    <input type="text" class="form-control-input" placeholder="Enter question description...">
                </div>
            </div>

            <!-- QUESTION 3 -->
            <div class="question-accordion">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <span>Question 3</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="accordion-content">
                    <div class="field-label">Question Type</div>
                    <select class="select-input">
                        <option>Multiple Choice (Single Answer)</option>
                    </select>
                    <div class="field-label">Question</div>
                    <input type="text" class="form-control-input" placeholder="Enter question description...">
                </div>
            </div>

            <!-- QUESTION 4 -->
            <div class="question-accordion">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <span>Question 4</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="accordion-content">
                    <div class="field-label">Question Type</div>
                    <select class="select-input">
                        <option>Multiple Choice (Single Answer)</option>
                    </select>
                    <div class="field-label">Question</div>
                    <input type="text" class="form-control-input" placeholder="Enter question description...">
                </div>
            </div>

            <!-- QUESTION 5 -->
            <div class="question-accordion">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <span>Question 5</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="accordion-content">
                    <div class="field-label">Question Type</div>
                    <select class="select-input">
                        <option>Multiple Choice (Single Answer)</option>
                    </select>
                    <div class="field-label">Question</div>
                    <input type="text" class="form-control-input" placeholder="Enter question description...">
                </div>
            </div>

        </div>

        <!-- Center Bottom Save Button Layout -->
        <div class="action-container">
            <button class="btn-submit-save" onclick="location.href='quizzes.html'">Save and Publish Changes</button>
        </div>
    </main>

    <script>
        function toggleAccordion(headerElement) {
            const accordionItem = headerElement.parentElement;
            accordionItem.classList.toggle('open');
        }
    </script>
    <script src="js/navbar.js"></script>
</body>

</html>
