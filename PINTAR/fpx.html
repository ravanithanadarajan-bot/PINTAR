<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPX Payment</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #2563eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .fpx-container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 320px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            font-weight: 600;
        }

        /* CSS Spinner Animation */
        .spinner {
            width: 50px;
            height: 50px;
            margin: 2rem auto;
            border: 4px solid #e5e7eb;
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .status-text {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 0.5rem;
        }

        .sub-text {
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="fpx-container">
        <h1>FPX Payment</h1>

        <div class="spinner"></div>

        <p class="status-text">Payment Gateway Loading...</p>
        <p class="sub-text">Please do not refresh or close this page.</p>
    </div>

</body>

</html>
