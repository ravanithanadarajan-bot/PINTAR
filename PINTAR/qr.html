<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Payment</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #2563eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .qr-container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 320px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .qr-placeholder {
            width: 220px;
            height: 220px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
        }

        .qr-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .instructions {
            margin-top: 1.25rem;
            font-size: 0.875rem;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="qr-container">
        <h1>QR Payment</h1>

        <div class="qr-placeholder">
            <!-- Replace the src URL below with your actual QR code image path -->
            <img src="https://via.placeholder.com/220?text=Scan+QR+Code" alt="QR Code Payment">
        </div>

        <p class="instructions">Scan this code using your banking or payment app to complete the transaction.</p>
    </div>

</body>

</html>
