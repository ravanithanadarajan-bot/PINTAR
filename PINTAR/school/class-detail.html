<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PINTAR - Class Detail Grid</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #1e293b;
            padding-bottom: 60px;
        }

        .navbar {
            background-color: #273894;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            height: 70px;
            color: white;
            border-radius: 50px;
            margin: 20px auto 0 auto;
            width: 95%;
        }

        .navbar .logo {
            display: flex;
            align-items: center;
            font-size: 36px;
            font-weight: 800;
            color: white;
        }

        .navbar .logo img {
            height: 38px;
            width: auto;
            display: block;
        }

        .navbar nav {
            display: flex;
            gap: 40px;
            height: 100%;
            align-items: center;
        }

        .navbar nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            padding: 6px 0;
            position: relative;
            opacity: 0.8;
        }

        .navbar nav a.active {
            opacity: 1;
            font-weight: 700;
            border-bottom: 3px solid white;
        }

        .navbar .right-menu {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .navbar .profile {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }


        .container {
            width: 95%;
            margin: 0 auto;
            padding: 30px 0;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 35px;
        }

        .class-info h1 {
            font-size: 38px;
            font-weight: 800;
            color: #000000;
            text-transform: uppercase;
        }

        .class-info p {
            font-size: 24px;
            font-weight: 700;
            color: #475569;
            margin-top: 4px;
        }

        .stats-panel {
            display: flex;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 18px 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            min-width: 500px;
        }

        .stat-box {
            flex: 1;
            padding: 0 15px;
            position: relative;
        }

        .stat-box:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 15%;
            height: 70%;
            width: 1px;
            background-color: #cbd5e1;
        }

        .stat-label {
            font-size: 13px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 34px;
            font-weight: 800;
            color: #273894;
        }

        .content-panel {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        .search-container {
            position: relative;
            flex: 1;
            max-width: 350px;
        }

        .search-container i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .search-container input {
            width: 100%;
            padding: 12px 16px 12px 45px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
        }

        .filter-select {
            padding: 12px 20px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            background-color: white;
            min-width: 200px;
            cursor: pointer;
        }

        .btn-export {
            background-color: #273894;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .table-header {
            display: grid;
            grid-template-columns: 60px 2fr 1.2fr 1.2fr 180px;
            background-color: #dbeafe;
            padding: 14px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            color: #1e293b;
            margin-bottom: 15px;
        }

        .table-header div:nth-child(3),
        .table-header div:nth-child(4) {
            text-align: center;
        }

        .table-header div:last-child {
            text-align: right;
            padding-right: 40px;
        }

        .student-row {
            display: grid;
            grid-template-columns: 60px 2fr 1.2fr 1.2fr 180px;
            align-items: center;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 14px 20px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #000000;
            cursor: pointer;
            transition: all 0.2s;
        }

        .student-row:hover {
            background-color: #f1f5f9;
            border-color: #2563eb;
        }

        .student-row div:nth-child(2) {
            font-weight: 700;
            color: #0f172a;
        }

        .student-row div:nth-child(3),
        .student-row div:nth-child(4) {
            text-align: center;
        }

        .student-row div:last-child {
            text-align: right;
        }

        .perf-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            width: 150px;
        }

        .badge-excellent {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .badge-good {
            background-color: #dbeafe;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
        }

        .badge-average {
            background-color: #fef9c3;
            color: #a16207;
            border: 1px solid #fef08a;
        }

        .badge-improvement {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .pagination-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
        }

        .pagination-controls {
            display: flex;
            gap: 8px;
        }

        .btn-page {
            border: 1px solid #cbd5e1;
            background: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-page.active {
            background-color: #273894;
            color: white;
            border-color: #273894;
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="logo"><img src="../images/logo.png" alt="PINTAR Logo"></div>
        <nav>
            <a href="dashboard.html">Home</a>
            <a href="classes.html" class="active">Classes</a>
        </nav>
        <div class="right-menu">
            <button style="background:none; border:none; color:white; font-size:18px; cursor:pointer;"><i
                    class="fa-regular fa-bell"></i></button>
            <button style="background:none; border:none; color:white; font-size:13px; font-weight:600; cursor:pointer;"
                onclick="window.location.href='../index.html'">LOG OUT</button>
            <div class="profile"><i class="fa-solid fa-circle-user"></i>&nbsp;&nbsp;<span>SMK PEKAN</span></div>
        </div>
    </header>



    <main class="container">
        <a href="classes.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back</a>

        <div class="header-section">
            <div class="class-info">
                <h1 id="classNameView">Year 1 ALPHA</h1>
                <p>28 Students</p>
            </div>
            <div class="stats-panel">
                <div class="stat-box">
                    <div class="stat-label">Average Score</div>
                    <div class="stat-value">86%</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Quizzes Completed</div>
                    <div class="stat-value">1</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Top Score</div>
                    <div class="stat-value">100%</div>
                </div>
            </div>
        </div>

        <div class="content-panel">
            <section class="toolbar">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search students...">
                </div>
                <select class="filter-select">
                    <option>Sort by Name (A-Z)</option>
                </select>
                <button class="btn-export" id="exportBtn"><i class="fa-solid fa-download"></i> Export</button>
            </section>

            <div class="table-header">
                <div>#</div>
                <div>Student Name</div>
                <div>Average Score</div>
                <div>Quizzes Completed</div>
                <div>Performance</div>
            </div>

            <div id="tableBody"></div>

            <footer class="pagination-footer">
                <div id="paginationInfo">Showing 1 to 10 of 28 students</div>
                <div class="pagination-controls" id="paginationControls"></div>
            </footer>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const className = urlParams.get('class') || 'Year 1 Alpha';
        document.getElementById('classNameView').textContent = className;

        const studentsList = [
            { id: "stud_1", name: "Aisyah Binti Ahmad", score: 92, quizCount: 1 },
            { id: "stud_2", name: "Amirul Hakim Bin Zainal", score: 96, quizCount: 1 },
            { id: "stud_3", name: "Chiew Li Wen", score: 85, quizCount: 1 },
            { id: "stud_4", name: "Daniel Wong Jia Sheng", score: 80, quizCount: 1 },
            { id: "stud_5", name: "Farah Nabila Binti Rosli", score: 75, quizCount: 1 },
            { id: "stud_6", name: "Gabriel Lim Wei Jie", score: 70, quizCount: 1 },
            { id: "stud_7", name: "Kavitha A/P Subramaniam", score: 45, quizCount: 1 },
            { id: "stud_8", name: "Harith Bin Yusof", score: 40, quizCount: 1 },
            { id: "stud_9", name: "Lim Yi Xuan", score: 46, quizCount: 1 },
            { id: "stud_10", name: "Sharvin Raj A/L Kumar", score: 45, quizCount: 1 },
            { id: "stud_11", name: "Muhammad Ali Bin Osman", score: 98, quizCount: 1 },
            { id: "stud_12", name: "Nurul Izzah Binti Mansor", score: 88, quizCount: 1 },
            { id: "stud_13", name: "Tan Wei Meng", score: 79, quizCount: 1 }
        ];

        localStorage.setItem('pintar_students', JSON.stringify(studentsList));
        let filteredData = [...studentsList];
        let currentPage = 1, rowsPerPage = 10;

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            let start = (currentPage - 1) * rowsPerPage;
            let end = Math.min(start + rowsPerPage, filteredData.length);
            let pageItems = filteredData.slice(start, end);

            pageItems.forEach((student, index) => {
                let badgeTxt = "Need Improvement", badgeCls = "badge-improvement";
                if (student.score >= 90) { badgeTxt = "Excellent"; badgeCls = "badge-excellent"; }
                else if (student.score >= 80) { badgeTxt = "Good"; badgeCls = "badge-good"; }
                else if (student.score >= 60) { badgeTxt = "Average"; badgeCls = "badge-average"; }

                tbody.innerHTML += `
                    <div class="student-row" onclick="window.location.href='student-report.html?id=${student.id}'">
                        <div>${start + index + 1}</div>
                        <div>${student.name}</div>
                        <div>${student.score}%</div>
                        <div>${student.quizCount}</div>
                        <div><span class="perf-badge ${badgeCls}">${badgeTxt}</span></div>
                    </div>
                `;
            });
            document.getElementById('paginationInfo').textContent = `Showing ${start + 1} to ${end} of ${filteredData.length} students`;
            renderPagination();
        }

        function renderPagination() {
            const controls = document.getElementById('paginationControls');
            controls.innerHTML = '';
            let pages = Math.ceil(filteredData.length / rowsPerPage);
            for (let i = 1; i <= pages; i++) {
                controls.innerHTML += `<button class="btn-page ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
        }

        function goToPage(p) { currentPage = p; renderTable(); }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            let q = e.target.value.toLowerCase().trim();
            filteredData = studentsList.filter(s => s.name.toLowerCase().includes(q));
            currentPage = 1;
            renderTable();
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            let csv = "Standard #,Student Name,Average Score,Quizzes,Performance\n";
            filteredData.forEach((s, i) => {
                csv += `${i + 1},"${s.name}",${s.score}%,${s.quizCount},Active\n`;
            });
            let link = document.createElement("a");
            link.setAttribute("href", "data:text/csv;charset=utf-8," + encodeURIComponent(csv));
            link.setAttribute("download", "student_report.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        window.onload = renderTable;
    </script>
</body>

</html>
