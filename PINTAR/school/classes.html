<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PINTAR - Year Overview</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #1e293b;
            padding-bottom: 60px;
        }

        .navbar {
            background-color: #273894;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            height: 70px;
            color: white;
            border-radius: 50px;
            margin: 20px auto 0 auto;
            width: 95%;
        }

        .navbar .logo {
            display: flex;
            align-items: center;
            font-size: 36px;
            font-weight: 800;
            color: white;
        }

        .navbar .logo img {
            height: 38px;
            width: auto;
            display: block;
        }

        .navbar nav {
            display: flex;
            gap: 40px;
            height: 100%;
            align-items: center;
        }

        .navbar nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            padding: 6px 0;
            position: relative;
            opacity: 0.8;
        }

        .navbar nav a.active {
            opacity: 1;
            font-weight: 700;
            border-bottom: 3px solid white;
        }

        .navbar .right-menu {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .navbar .profile {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .container {
            width: 95%;
            margin: 0 auto;
            padding: 30px 0;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
        }

        .title-view {
            font-size: 38px;
            font-weight: 800;
            color: #000000;
            margin-top: 10px;
        }

        .school-name {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .stats-panel {
            display: flex;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 18px 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            min-width: 500px;
        }

        .stat-box {
            flex: 1;
            padding: 0 15px;
            position: relative;
        }

        .stat-box:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 15%;
            height: 70%;
            width: 1px;
            background-color: #cbd5e1;
        }

        .stat-label {
            font-size: 13px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 34px;
            font-weight: 800;
            color: #273894;
        }

        .tabs-row {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: white;
            border: 2px solid #273894;
            color: #273894;
            padding: 10px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            min-width: 120px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: #273894;
            color: white;
        }

        .content-panel {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            overflow-x: auto;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        .search-container {
            position: relative;
            flex: 1;
            max-width: 350px;
        }

        .search-container i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .search-container input {
            width: 100%;
            padding: 12px 16px 12px 45px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
        }

        .filter-select {
            padding: 12px 20px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            background-color: white;
            min-width: 200px;
            cursor: pointer;
        }

        .btn-export {
            background-color: #273894;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .table-header {
            display: grid;
            grid-template-columns: 50px 1.8fr 1.2fr 1fr 1fr 1fr 1.2fr 150px;
            background-color: #dbeafe;
            padding: 14px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            color: #1e293b;
            margin-bottom: 15px;
            min-width: 1000px;
        }

        .table-header div:nth-child(4),
        .table-header div:nth-child(5) {
            text-align: center;
        }

        .table-header div:last-child {
            text-align: right;
            padding-right: 20px;
        }

        .student-row {
            display: grid;
            grid-template-columns: 50px 1.8fr 1.2fr 1fr 1fr 1fr 1.2fr 150px;
            align-items: center;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 14px 20px;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #000000;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 1000px;
        }

        .student-row:hover {
            background-color: #f1f5f9;
            border-color: #2563eb;
        }

        .student-row div:nth-child(2) {
            font-weight: 700;
            color: #0f172a;
        }

        .student-row div:nth-child(4),
        .student-row div:nth-child(5) {
            text-align: center;
        }

        .student-row div:last-child {
            text-align: right;
        }

        .perf-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            width: 130px;
        }

        .badge-excellent {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .badge-good {
            background-color: #dbeafe;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
        }

        .badge-average {
            background-color: #fef9c3;
            color: #a16207;
            border: 1px solid #fef08a;
        }

        .badge-improvement {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .pagination-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
        }

        .pagination-controls {
            display: flex;
            gap: 8px;
        }

        .btn-page {
            border: 1px solid #cbd5e1;
            background: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-page.active {
            background-color: #273894;
            color: white;
            border-color: #273894;
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="logo"><img src="../images/logo.png" alt="PINTAR Logo"></div>
        <nav>
            <a href="dashboard.html">Home</a>
            <a href="classes.html" class="active">Year</a>
        </nav>
        <div class="right-menu">
            <button style="background:none; border:none; color:white; font-size:18px; cursor:pointer;"><i
                    class="fa-regular fa-bell"></i></button>
            <button style="background:none; border:none; color:white; font-size:13px; font-weight:600; cursor:pointer;"
                onclick="window.location.href='../index.html'">LOG OUT</button>
            <div class="profile"><i class="fa-solid fa-circle-user"></i>&nbsp;&nbsp;<span>SMK PEKAN</span></div>
        </div>
    </header>

    <main class="container">
        <div class="header-section">
            <div>
                <h1 class="title-view">Year Overview</h1>
                <p class="school-name">SMK PEKAN</p>
            </div>
            <div class="stats-panel">
                <div class="stat-box">
                    <div class="stat-label">Average Score</div>
                    <div class="stat-value" id="statAvg">86%</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Total Students</div>
                    <div class="stat-value" id="statTotal">28</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Top Score</div>
                    <div class="stat-value" id="statTop">100%</div>
                </div>
            </div>
        </div>

        <div class="tabs-row">
            <button class="tab-btn active" onclick="switchYear(1, this)">Year 1</button>
            <button class="tab-btn" onclick="switchYear(2, this)">Year 2</button>
            <button class="tab-btn" onclick="switchYear(3, this)">Year 3</button>
            <button class="tab-btn" onclick="switchYear(4, this)">Year 4</button>
            <button class="tab-btn" onclick="switchYear(5, this)">Year 5</button>
            <button class="tab-btn" onclick="switchYear(6, this)">Year 6</button>
        </div>

        <div class="content-panel">
            <section class="toolbar">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search students...">
                </div>
                <select class="filter-select">
                    <option>Sort by Name (A-Z)</option>
                </select>
                <button class="btn-export" id="exportBtn"><i class="fa-solid fa-download"></i> Export</button>
            </section>

            <div class="table-header">
                <div>#</div>
                <div>Student Name</div>
                <div>IC Number</div>
                <div>Class Name</div>
                <div>Score</div>
                <div>STEM Interest</div>
                <div>Dominant</div>
                <div>Performance</div>
            </div>

            <div id="tableBody"></div>

            <footer class="pagination-footer">
                <div id="paginationInfo">Showing 1 to 10 of 28 students</div>
                <div class="pagination-controls" id="paginationControls"></div>
            </footer>
        </div>
    </main>

    <script>
        const yearData = {
            1: [
                { id: "y1_1", name: "Aisyah Binti Ahmad", ic: "130101-06-5012", className: "1 Alpha", score: 92, stem: "Engineering", dominant: "Problem Solver" },
                { id: "y1_2", name: "Amirul Hakim Bin Zainal", ic: "130202-06-5124", className: "1 Beta", score: 96, stem: "Technology", dominant: "Creator" },
                { id: "y1_3", name: "Chiew Li Wen", ic: "130303-08-5236", className: "1 Charlie", score: 85, stem: "Science", dominant: "Analyst" },
                { id: "y1_4", name: "Daniel Wong Jia Sheng", ic: "130404-10-5348", className: "1 Alpha", score: 80, stem: "Mathematics", dominant: "Logician" },
                { id: "y1_5", name: "Farah Nabila Binti Rosli", ic: "130505-03-5452", className: "1 Beta", score: 75, stem: "Engineering", dominant: "Builder" },
                { id: "y1_6", name: "Gabriel Lim Wei Jie", ic: "130606-14-5564", className: "1 Charlie", score: 70, stem: "Technology", dominant: "Coder" },
                { id: "y1_7", name: "Kavitha A/P Subramaniam", ic: "130707-05-5678", className: "1 Alpha", score: 45, stem: "Science", dominant: "Observer" },
                { id: "y1_8", name: "Harith Bin Yusof", ic: "130808-11-5782", className: "1 Beta", score: 40, stem: "Mathematics", dominant: "Thinker" },
                { id: "y1_9", name: "Lim Yi Xuan", ic: "130909-01-5894", className: "1 Charlie", score: 46, stem: "Engineering", dominant: "Designer" },
                { id: "y1_10", name: "Sharvin Raj A/L Kumar", ic: "131010-07-5902", className: "1 Alpha", score: 45, stem: "Technology", dominant: "Innovator" },
                { id: "y1_11", name: "Muhammad Ali Bin Osman", ic: "131111-12-6014", className: "1 Beta", score: 98, stem: "Science", dominant: "Leader" },
                { id: "y1_12", name: "Nurul Izzah Binti Mansor", ic: "131212-04-6126", className: "1 Charlie", score: 88, stem: "Mathematics", dominant: "Planner" }
            ],
            2: [
                { id: "y2_1", name: "Siti Nurhaliza Bt. Rahman", ic: "120101-03-5014", className: "2 Alpha", score: 82, stem: "Engineering", dominant: "Creator" },
                { id: "y2_2", name: "Ahmad Ziqri Bin Farhan", ic: "120202-08-5126", className: "2 Beta", score: 95, stem: "Technology", dominant: "Coder" },
                { id: "y2_3", name: "Tan Wei Meng", ic: "120303-10-5238", className: "2 Charlie", score: 79, stem: "Science", dominant: "Analyst" },
                { id: "y2_4", name: "Jessica Lee", ic: "120404-14-5342", className: "2 Alpha", score: 89, stem: "Mathematics", dominant: "Logician" },
                { id: "y2_5", name: "Logan Raj", ic: "120505-01-5456", className: "2 Beta", score: 76, stem: "Engineering", dominant: "Builder" }
            ],
            3: [
                { id: "y3_1", name: "Nurul Ain Bt. Abdullah", ic: "110101-02-5018", className: "3 Alpha", score: 92, stem: "Science", dominant: "Leader" },
                { id: "y3_2", name: "Mohd Faris Bin Razak", ic: "110202-06-5120", className: "3 Beta", score: 48, stem: "Technology", dominant: "Thinker" },
                { id: "y3_3", name: "Chloe Tan", ic: "110303-09-5232", className: "3 Charlie", score: 50, stem: "Mathematics", dominant: "Planner" }
            ],
            4: [
                { id: "y4_1", name: "Dev Nathan", ic: "100101-05-5011", className: "4 Alpha", score: 42, stem: "Engineering", dominant: "Observer" },
                { id: "y4_2", name: "Hafizah Binti Omar", ic: "100202-11-5123", className: "4 Beta", score: 38, stem: "Science", dominant: "Builder" },
                { id: "y4_3", name: "Wong Kai Bin", ic: "100303-14-5235", className: "4 Charlie", score: 40, stem: "Technology", dominant: "Creator" }
            ],
            5: [
                { id: "y5_1", name: "Meena Sundram", ic: "090101-01-5019", className: "5 Alpha", score: 78, stem: "Mathematics", dominant: "Analyst" },
                { id: "y5_2", name: "Zul Ariffin Bin Ismail", ic: "090202-07-5121", className: "5 Beta", score: 75, stem: "Engineering", dominant: "Innovator" }
            ],
            6: [
                { id: "y6_1", name: "Brandon Lee", ic: "080101-10-5015", className: "6 Alpha", score: 80, stem: "Technology", dominant: "Leader" },
                { id: "y6_2", name: "Nurul Shuhada", ic: "080202-04-5127", className: "6 Beta", score: 72, stem: "Science", dominant: "Logician" }
            ]
        };

        let currentYear = 1;
        let currentStudents = [];
        let filteredData = [];
        let currentPage = 1;
        let rowsPerPage = 10;

        function switchYear(yearNum, element) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (element) element.classList.add('active');

            currentYear = yearNum;
            currentStudents = yearData[yearNum] || [];
            filteredData = [...currentStudents];
            currentPage = 1;

            document.getElementById('statTotal').textContent = currentStudents.length;
            if (currentStudents.length > 0) {
                let totalScore = currentStudents.reduce((sum, s) => sum + s.score, 0);
                let avg = Math.round(totalScore / currentStudents.length);
                let top = Math.max(...currentStudents.map(s => s.score));
                document.getElementById('statAvg').textContent = avg + "%";
                document.getElementById('statTop').textContent = top + "%";
            } else {
                document.getElementById('statAvg').textContent = "0%";
                document.getElementById('statTop').textContent = "0%";
            }

            document.getElementById('searchInput').value = '';
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            let start = (currentPage - 1) * rowsPerPage;
            let end = Math.min(start + rowsPerPage, filteredData.length);
            let pageItems = filteredData.slice(start, end);

            if (pageItems.length === 0) {
                tbody.innerHTML = `<div style="text-align: center; padding: 25px; color: #64748b; font-weight: 600; grid-column: span 8;">No students found for Year ${currentYear}.</div>`;
            }

            pageItems.forEach((student, index) => {
                let badgeTxt = "Need Improvement", badgeCls = "badge-improvement";
                if (student.score >= 90) { badgeTxt = "Excellent"; badgeCls = "badge-excellent"; }
                else if (student.score >= 80) { badgeTxt = "Good"; badgeCls = "badge-good"; }
                else if (student.score >= 60) { badgeTxt = "Average"; badgeCls = "badge-average"; }

                tbody.innerHTML += `
                    <div class="student-row" onclick="window.location.href='student-report.html?id=${student.id}'">
                        <div>${start + index + 1}</div>
                        <div>${student.name}</div>
                        <div>${student.ic}</div>
                        <div>${student.className}</div>
                        <div style="text-align:center;">${student.score}%</div>
                        <div>${student.stem}</div>
                        <div>${student.dominant}</div>
                        <div><span class="perf-badge ${badgeCls}">${badgeTxt}</span></div>
                    </div>
                `;
            });
            document.getElementById('paginationInfo').textContent = filteredData.length > 0 ? `Showing ${start + 1} to ${end} of ${filteredData.length} students` : `Showing 0 of 0 students`;
            renderPagination();
        }

        function renderPagination() {
            const controls = document.getElementById('paginationControls');
            controls.innerHTML = '';
            let pages = Math.ceil(filteredData.length / rowsPerPage) || 1;
            for (let i = 1; i <= pages; i++) {
                controls.innerHTML += `<button class="btn-page ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
        }

        function goToPage(p) { currentPage = p; renderTable(); }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            let q = e.target.value.toLowerCase().trim();
            filteredData = currentStudents.filter(s => s.name.toLowerCase().includes(q) || s.ic.toLowerCase().includes(q) || s.className.toLowerCase().includes(q) || s.stem.toLowerCase().includes(q));
            currentPage = 1;
            renderTable();
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            let csv = "Index,Student Name,IC Number,Class Name,Score,STEM Interest,Dominant,Performance\n";
            filteredData.forEach((s, i) => {
                csv += `${i + 1},"${s.name}","${s.ic}","${s.className}",${s.score}%,${s.stem},${s.dominant},Active\n`;
            });
            let link = document.createElement("a");
            link.setAttribute("href", "data:text/csv;charset=utf-8," + encodeURIComponent(csv));
            link.setAttribute("download", `year_${currentYear}_students_report.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        window.onload = () => { switchYear(1, document.querySelector('.tab-btn')); };
    </script>
</body>

</html>
